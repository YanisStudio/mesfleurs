    <!-- 保持原版的 Firebase 初始化方式以確保兼容性 -->
    <script src="../js/firebase-config.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { 
          getAuth, 
          onAuthStateChanged,
          signOut
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import {
          initializeFirestore,
          collection,
          doc,
          getDoc,
          getDocs,
          deleteDoc,
          updateDoc,
          query,
          orderBy,
          where,
          serverTimestamp
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = window.FIREBASE_CONFIG;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // 固定使用長輪詢（experimentalForceLongPolling），不先嘗試串流連線。
        // 公司網路、VPN、防毒軟體常會擋住或緩衝串流連線，自動偵測要等 10 秒逾時才會改用長輪詢，
        // 期間所有讀取都會失敗（顯示 client is offline）。本站都是一次性讀寫，長輪詢不影響功能
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });
        
        window.firebaseServices = {
          auth: auth,
          db: db,
          getAuth,
          signOut,
          onAuthStateChanged,
          doc,
          getDoc,
          collection,
          getDocs,
          deleteDoc,
          updateDoc,
          query,
          where,
          orderBy,
          serverTimestamp
        };
    </script>

    <style>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // 等待 AdminCommon 載入完成
        const waitForAdminCommon = function() {
            if (window.AdminCommon) {
                console.log('AdminCommon 已載入');
                checkAdminAccess();
            } else {
                console.log('等待 AdminCommon 載入...');
                setTimeout(waitForAdminCommon, 100);
            }
        };
        
        // 權限檢查
        const checkAdminAccess = function() {
            window.AdminCommon.checkAdminAccess(
                function(user) {
                    // 成功回調
                    console.log('管理員已登入');
                    showMessagesSection();
                    loadMessages();
                },
                function(error) {
                    // 失敗回調
                    console.log('權限檢查失敗:', error);
                    if (error === '未登入') {
                        showNotLoggedInSection();
                    } else {
                        showUnauthorizedSection(error);
                    }
                }
            );
        };
        
        // 顯示訊息管理區塊
        const showMessagesSection = function() {
            document.getElementById('messages-section').style.display = 'block';
            document.getElementById('unauthorized-section').style.display = 'none';
            document.getElementById('not-logged-in-section').style.display = 'none';
        };
        
        // 顯示未授權區塊
        const showUnauthorizedSection = function(error) {
            document.getElementById('messages-section').style.display = 'none';
            document.getElementById('unauthorized-section').style.display = 'block';
            document.getElementById('not-logged-in-section').style.display = 'none';
            
            const currentUser = window.AdminCommon.getCurrentUser();
            const currentUserEmail = document.getElementById('current-user-email');
            if (currentUserEmail && currentUser) {
                currentUserEmail.textContent = `當前登入帳號: ${currentUser.email}`;
            }
        };
        
        // 顯示未登入區塊
        const showNotLoggedInSection = function() {
            document.getElementById('messages-section').style.display = 'none';
            document.getElementById('unauthorized-section').style.display = 'none';
            document.getElementById('not-logged-in-section').style.display = 'block';
        };
        
        // 從 Firestore 加載訊息
        const loadMessages = async function() {
            window.AdminCommon.showLoading('載入訊息中...');
            const messageList = document.getElementById('message-list');
            
            try {
                messageList.innerHTML = '<p class="placeholder-message">讀取訊息中...</p>';
                
                const db = window.firebaseServices.db;
                const collection = window.firebaseServices.collection;
                const query = window.firebaseServices.query;
                const orderBy = window.firebaseServices.orderBy;
                const getDocs = window.firebaseServices.getDocs;
                
                // 獲取 messages 集合的引用，按時間排序（最新在前）
                const messagesCollectionRef = collection(db, 'messages');
                const q = query(messagesCollectionRef, orderBy('createdAt', 'desc'));
                
                // 獲取文檔
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    messageList.innerHTML = '<p class="placeholder-message">目前沒有訊息</p>';
                    return;
                }
                
                messageList.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const messageData = doc.data();
                    const messageId = doc.id;
                    
                    // 獲取時間戳記
                    let timestamp = messageData.createdAt;
                    let formattedDate = '未知時間';

                    if (timestamp && timestamp.toDate) {
                        formattedDate = window.AdminCommon.formatDate(timestamp, 'full');
                    } else if (timestamp) {
                        formattedDate = window.AdminCommon.formatDate(new Date(timestamp), 'full');
                    }

                    // 回覆時間戳記
                    let repliedTimestamp = messageData.repliedAt;
                    let repliedFormattedDate = '';
                    if (repliedTimestamp && repliedTimestamp.toDate) {
                        repliedFormattedDate = window.AdminCommon.formatDate(repliedTimestamp, 'full');
                    } else if (repliedTimestamp) {
                        repliedFormattedDate = window.AdminCommon.formatDate(new Date(repliedTimestamp), 'full');
                    }

                    const hasReply = !!messageData.reply;
                    const replyDisplayHTML = hasReply ? `
                        <div class="message-reply">
                            <h4><i class="fas fa-reply"></i> 商家回覆${repliedFormattedDate ? `（${repliedFormattedDate}）` : ''}</h4>
                            <p>${escapeHtml(messageData.reply)}</p>
                        </div>
                    ` : '';

                    const messageItem = document.createElement('div');
                    messageItem.className = `message-item ${messageData.read ? 'read' : 'unread'}`;
                    messageItem.innerHTML = `
                        <div class="message-header">
                            <h3>${escapeHtml(messageData.subject) || '無主旨'}</h3>
                            <span class="message-date">${formattedDate}</span>
                        </div>
                        <div class="message-sender">
                            <span><i class="fas fa-user"></i> <strong>姓名:</strong> ${escapeHtml(messageData.name)}</span>
                            <span><i class="fas fa-envelope"></i> <strong>信箱:</strong> ${escapeHtml(messageData.email)}</span>
                            <span><i class="fas fa-phone"></i> <strong>電話:</strong> ${escapeHtml(messageData.phone) || 'N/A'}</span>
                        </div>
                        <div class="message-content">
                            <p>${escapeHtml(messageData.message)}</p>
                        </div>
                        <div class="message-reply-section">
                            ${replyDisplayHTML}
                            <textarea class="reply-textarea" data-id="${messageId}" placeholder="輸入回覆內容...">${escapeHtml(messageData.reply || '')}</textarea>
                            <button class="reply-btn" data-id="${messageId}">
                                <i class="fas fa-paper-plane"></i> ${hasReply ? '更新回覆' : '送出回覆'}
                            </button>
                        </div>
                        <div class="message-actions">
                            <button class="mark-read-btn ${messageData.read ? 'btn-outline' : ''}" data-id="${messageId}">
                                <i class="fas ${messageData.read ? 'fa-envelope' : 'fa-envelope-open'}"></i>
                                ${messageData.read ? '標記為未讀' : '標記為已讀'}
                            </button>
                            <button class="delete-btn" data-id="${messageId}">
                                <i class="fas fa-trash-alt"></i> 刪除
                            </button>
                        </div>
                    `;
                    messageList.appendChild(messageItem);
                });
                
                // 綁定按鈕事件
                bindMessageActions();
                
            } catch (error) {
                console.error('獲取訊息時出錯:', error);
                window.AdminCommon.handleError(error, '載入訊息');
                messageList.innerHTML = '<p class="placeholder-message error">獲取訊息時出錯，請稍後再試</p>';
            } finally {
                window.AdminCommon.hideLoading();
            }
        };
        
        // 綁定訊息操作事件
        const bindMessageActions = function() {
            // 標記已讀/未讀功能
            document.querySelectorAll('.mark-read-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const messageId = this.getAttribute('data-id');
                    toggleMessageReadStatus(messageId);
                });
            });
            
            // 刪除功能
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async function() {
                    const messageId = this.getAttribute('data-id');
                    const confirmed = await window.AdminCommon.showConfirmDialog(
                        '確定要刪除這則訊息嗎？',
                        '確認刪除'
                    );
                    if (confirmed) {
                        deleteMessage(messageId);
                    }
                });
            });

            // 回覆功能
            document.querySelectorAll('.reply-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const messageId = this.getAttribute('data-id');
                    const textarea = document.querySelector(`.reply-textarea[data-id="${messageId}"]`);
                    const replyText = textarea ? textarea.value.trim() : '';
                    if (!replyText) {
                        window.AdminCommon.showToast('回覆內容不能為空', 'warning');
                        return;
                    }
                    submitReply(messageId, replyText);
                });
            });
        };

        // 送出/更新回覆
        const submitReply = async function(messageId, replyText) {
            try {
                const db = window.firebaseServices.db;
                const doc = window.firebaseServices.doc;
                const updateDoc = window.firebaseServices.updateDoc;
                const serverTimestamp = window.firebaseServices.serverTimestamp;

                const messageDocRef = doc(db, 'messages', messageId);
                await updateDoc(messageDocRef, {
                    reply: replyText,
                    repliedAt: serverTimestamp()
                });

                window.AdminCommon.showToast('回覆已送出', 'success');
                loadMessages(); // 重新加載訊息列表
            } catch (error) {
                console.error('送出回覆時出錯:', error);
                window.AdminCommon.handleError(error, '送出回覆');
            }
        };

        // 切換訊息已讀/未讀狀態
        const toggleMessageReadStatus = async function(messageId) {
            try {
                const db = window.firebaseServices.db;
                const doc = window.firebaseServices.doc;
                const getDoc = window.firebaseServices.getDoc;
                const updateDoc = window.firebaseServices.updateDoc;
                
                const messageDocRef = doc(db, 'messages', messageId);
                
                // 先獲取當前訊息
                const docSnap = await getDoc(messageDocRef);
                
                if (docSnap.exists()) {
                    const messageData = docSnap.data();
                    // 更新已讀狀態（取反）
                    await updateDoc(messageDocRef, {
                        read: !messageData.read
                    });
                    
                    console.log('已讀狀態已更新');
                    window.AdminCommon.showToast('已讀狀態已更新', 'success');
                    loadMessages(); // 重新加載訊息列表
                } else {
                    throw new Error('找不到訊息');
                }
            } catch (error) {
                console.error('更新已讀狀態時出錯:', error);
                window.AdminCommon.handleError(error, '更新已讀狀態');
            }
        };
        
        // 刪除單個訊息
        const deleteMessage = async function(messageId) {
            window.AdminCommon.showLoading('刪除訊息中...');
            try {
                const db = window.firebaseServices.db;
                const doc = window.firebaseServices.doc;
                const deleteDoc = window.firebaseServices.deleteDoc;
                
                const messageDocRef = doc(db, 'messages', messageId);
                await deleteDoc(messageDocRef);
                
                console.log('訊息已刪除');
                window.AdminCommon.showToast('訊息已刪除', 'success');
                loadMessages(); // 重新加載訊息列表
            } catch (error) {
                console.error('刪除訊息時出錯:', error);
                window.AdminCommon.handleError(error, '刪除訊息');
            } finally {
                window.AdminCommon.hideLoading();
            }
        };
        
        // 刪除所有訊息
        const deleteAllMessages = async function() {
            const confirmed = await window.AdminCommon.showConfirmDialog(
                '確定要清除所有訊息嗎？此操作無法撤銷！',
                '確認清除所有訊息'
            );
            
            if (!confirmed) return;
            
            window.AdminCommon.showLoading('清除所有訊息中...');
            try {
                const db = window.firebaseServices.db;
                const collection = window.firebaseServices.collection;
                const getDocs = window.firebaseServices.getDocs;
                const deleteDoc = window.firebaseServices.deleteDoc;
                
                const messagesCollectionRef = collection(db, 'messages');
                const querySnapshot = await getDocs(messagesCollectionRef);
                
                const deletePromises = [];
                querySnapshot.forEach((doc) => {
                    deletePromises.push(deleteDoc(doc.ref));
                });
                
                await Promise.all(deletePromises);
                
                console.log('所有訊息已刪除');
                window.AdminCommon.showToast('所有訊息已清除', 'success');
                loadMessages(); // 重新加載訊息列表
            } catch (error) {
                console.error('刪除所有訊息時出錯:', error);
                window.AdminCommon.handleError(error, '清除所有訊息');
            } finally {
                window.AdminCommon.hideLoading();
            }
        };
        
        // 綁定按鈕事件
        const bindEvents = function() {
            // 刷新按鈕
            const refreshBtn = document.getElementById('refresh-btn');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', function() {
                    loadMessages();
                });
            }
            
            // 清除所有訊息按鈕
            const clearAllBtn = document.getElementById('clear-all-btn');
            if (clearAllBtn) {
                clearAllBtn.addEventListener('click', function() {
                    deleteAllMessages();
                });
            }
        };
        
        // 綁定事件
        bindEvents();
        
        // 開始初始化流程
        waitForAdminCommon();
    });
    </script>
</body>
</html>
