    <script type="module">
        // 導入Firebase所需模組
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import {
            initializeFirestore,
            collection,
            doc,
            getDocs,
            getDoc,
            updateDoc,
            deleteDoc,
            query,
            orderBy,
            where
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // Firebase配置 - 統一使用與其他頁面相同的配置
        const firebaseConfig = window.FIREBASE_CONFIG;

        // 初始化Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // 固定使用長輪詢（experimentalForceLongPolling），不先嘗試串流連線。
        // 公司網路、VPN、防毒軟體常會擋住或緩衝串流連線，自動偵測要等 10 秒逾時才會改用長輪詢，
        // 期間所有讀取都會失敗（顯示 client is offline）。本站都是一次性讀寫，長輪詢不影響功能
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });
        
        // 將Firebase服務變數暴露給全局使用
        window.firebaseServices = {
            auth: auth,
            db: db,
            getAuth,
            onAuthStateChanged,
            signOut,
            collection,
            doc,
            getDocs,
            getDoc,
            updateDoc,
            deleteDoc,
            query,
            orderBy,
            where
        };
    </script>

            align-items: center;
            font-weight: normal;
            margin-bottom: 0;
            cursor: pointer;
            white-space: nowrap;
        }

    </style>
    
    <script>
        // 使用 admin-common.js 的管理員檢查函數（讀 Firebase Auth custom claim）
        async function isAdmin(user) {
            // 如果 AdminCommon 還沒載入，回傳 false
            if (!window.AdminCommon || !window.AdminCommon.isAdmin) {
                return false;
            }
            return window.AdminCommon.isAdmin(user);
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 等待 AdminCommon 載入完成
            const waitForAdminCommon = function() {
                if (window.AdminCommon) {
                    console.log('AdminCommon 已載入');
                    initializeOrderPanel();
                } else {
                    console.log('等待 AdminCommon 載入...');
                    setTimeout(waitForAdminCommon, 100);
                }
            };
            
            function initializeOrderPanel() {
                const ordersSection = document.getElementById('orders-section');
                const unauthorizedSection = document.getElementById('unauthorized-section');
                const orderList = document.getElementById('order-list');
                const orderDetail = document.getElementById('order-detail');
                const refreshBtn = document.getElementById('refresh-btn');
                const statusFilter = document.getElementById('status-filter');
                const searchInput = document.getElementById('search-order');
                const searchBtn = document.getElementById('search-btn');
                const logoutBtn = document.getElementById('logout-btn');
                const usernameDisplay = document.getElementById('username-display');
                const currentUserEmail = document.getElementById('current-user-email');
                const userDropdownBtn = document.getElementById('user-dropdown-btn');
                const userMenu = document.getElementById('user-menu');
                const exportExcelBtn = document.getElementById('export-excel-btn');
                const excelExportModal = document.getElementById('excel-export-modal');
                const excelExportForm = document.getElementById('excel-export-form');
                const cancelExportBtn = document.getElementById('cancel-export');

                // 管理首頁「最近訂單」的查看按鈕會帶 ?id=訂單ID，第一次載入列表後自動打開那筆
                let pendingOpenOrderId = new URLSearchParams(window.location.search).get('id');

                // 檢查當前登入狀態
                window.firebaseServices.onAuthStateChanged(window.firebaseServices.auth, async user => {
                    if (user) {
                        if (await isAdmin(user)) {
                            ordersSection.style.display = 'block';
                            unauthorizedSection.style.display = 'none';
                            if (usernameDisplay) {
                                usernameDisplay.textContent = '管理員';
                            }
                            loadOrders();
                        } else {
                            ordersSection.style.display = 'none';
                            unauthorizedSection.style.display = 'block';
                            if (currentUserEmail) {
                                currentUserEmail.textContent = `當前登入帳號: ${user.email}`;
                            }
                        }
                    } else {
                        ordersSection.style.display = 'none';
                        unauthorizedSection.style.display = 'block';
                        if (currentUserEmail) {
                            currentUserEmail.textContent = '您尚未登入';
                        }
                    }
                });

                // Excel匯出功能 - 使用 admin-common.css 的彈窗樣式
                if (exportExcelBtn) {
                    exportExcelBtn.addEventListener('click', function() {
                        excelExportModal.classList.add('active');
                    });
                }
                
                if (cancelExportBtn) {
                    cancelExportBtn.addEventListener('click', function() {
                        excelExportModal.classList.remove('active');
                    });
                }
                
                // Excel匯出表單提交
                if (excelExportForm) {
                    excelExportForm.addEventListener('submit', function(e) {
                        e.preventDefault();
                        generateExcelReport();
                    });
                }
                
                // 點擊模態框外部關閉
                window.addEventListener('click', function(e) {
                    if (e.target === excelExportModal) {
                        excelExportModal.classList.remove('active');
                    }
                });
                
                // 刷新按鈕
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', function() {
                        loadOrders();
                    });
                }
                
                // 狀態篩選
                if (statusFilter) {
                    statusFilter.addEventListener('change', function() {
                        loadOrders();
                    });
                }
                const sortFilter = document.getElementById('sort-filter');
                if (sortFilter) {
                    sortFilter.addEventListener('change', function() {
                        loadOrders();
                    });
                }
                
                // 搜尋功能
                if (searchBtn) {
                    searchBtn.addEventListener('click', function() {
                        loadOrders();
                    });
                }
                
                if (searchInput) {
                    searchInput.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            loadOrders();
                        }
                    });
                }
                
                // Excel 匯出：依彈窗的設定（訂單範圍、運費類別、日期範圍、報表類型）產生多個工作表
                const CATEGORY_LABELS = { bulbs: '花束', plants: '盆花・植栽', seeds: '花禮盒', other: '其他' };

                async function generateExcelReport() {
                    try {
                        const exportRange = document.querySelector('input[name="export-range"]:checked').value;
                        const selectedCategories = Array.from(document.querySelectorAll('input[name="category"]:checked')).map(cb => cb.value);
                        const reportTypes = Array.from(document.querySelectorAll('input[name="report-type"]:checked')).map(cb => cb.value);
                        const startDate = document.getElementById('start-date').value;
                        const endDate = document.getElementById('end-date').value;

                        if (selectedCategories.length === 0) {
                            window.AdminCommon.showToast('請至少勾選一個商品分類', 'warning');
                            return;
                        }
                        if (reportTypes.length === 0) {
                            window.AdminCommon.showToast('請至少勾選一種報表類型', 'warning');
                            return;
                        }
                        if (startDate && endDate && startDate > endDate) {
                            window.AdminCommon.showToast('開始日期不能晚於結束日期', 'warning');
                            return;
                        }

                        window.AdminCommon.showToast('正在生成Excel報表...', 'info');

                        const services = window.firebaseServices;
                        const ordersCollectionRef = services.collection(services.db, 'orders');
                        const q = exportRange === 'all'
                            ? services.query(ordersCollectionRef, services.orderBy('orderDate', 'desc'))
                            : services.query(ordersCollectionRef, services.where('status', '==', exportRange));

                        // 訂單裡的商品沒有存運費類別，要對照目前的商品資料（已刪除的商品算「其他」）
                        const [querySnapshot, productsSnapshot] = await Promise.all([
                            services.getDocs(q),
                            services.getDocs(services.collection(services.db, 'products'))
                        ]);
                        const productCategory = {};
                        productsSnapshot.forEach(docSnap => {
                            productCategory[docSnap.id] = docSnap.data().category || 'other';
                        });

                        // 依日期範圍、分類篩選，攤平成「一個商品一列」
                        const rows = [];
                        querySnapshot.forEach(docSnap => {
                            const order = docSnap.data();
                            const date = order.orderDate && order.orderDate.toDate ? order.orderDate.toDate() : null;
                            const dateKey = date ? localDateString(date) : '';
                            if (startDate && (!dateKey || dateKey < startDate)) return;
                            if (endDate && (!dateKey || dateKey > endDate)) return;

                            (order.items || []).forEach(item => {
                                const category = productCategory[item.id] || 'other';
                                if (!selectedCategories.includes(category)) return;
                                const quantity = Number(item.quantity) || 0;
                                const price = Number(item.price) || 0;
                                rows.push({
                                    order,
                                    orderNumber: order.orderNumber || docSnap.id,
                                    dateKey: dateKey || '未知日期',
                                    customerKey: order.userId || order.customer?.email || order.customer?.phone || order.customer?.name || docSnap.id,
                                    itemName: item.name || '未知商品',
                                    category,
                                    quantity,
                                    price,
                                    subtotal: quantity * price
                                });
                            });
                        });

                        if (rows.length === 0) {
                            window.AdminCommon.showToast('沒有找到符合條件的訂單', 'warning');
                            return;
                        }

                        const workbook = XLSX.utils.book_new();
                        const addSheet = (name, data, widths) => {
                            const sheet = XLSX.utils.aoa_to_sheet(data);
                            sheet['!cols'] = widths.map(width => ({ width }));
                            XLSX.utils.book_append_sheet(workbook, sheet, name);
                        };
                        const paymentText = payment => payment === 'transfer' ? 'ATM轉帳'
                            : payment === 'transfer_later' ? '稍後轉帳'
                            : payment === 'credit' ? '信用卡付款' : (payment || '');

                        if (reportTypes.includes('detailed')) {
                            const data = [[
                                '訂單日期', '訂單編號', '取花/送達日期', '時段', '客戶姓名', '客戶電話', '客戶Email', '取花方式', '外送地址', '卡片內容',
                                '付款方式', '商品名稱', '分類', '數量', '單價', '小計', '訂單狀態'
                            ]];
                            rows.forEach(row => {
                                data.push([
                                    row.dateKey,
                                    row.orderNumber,
                                    row.order.pickupDate || '',
                                    row.order.pickupTimeSlot || '',
                                    row.order.customer?.name || '未知客戶',
                                    row.order.customer?.phone || '',
                                    row.order.customer?.email || '',
                                    row.order.shipping === 'delivery' ? '在地外送' : '門市自取',
                                    row.order.customer?.address || '',
                                    row.order.cardMessage || '',
                                    paymentText(row.order.payment),
                                    row.itemName,
                                    CATEGORY_LABELS[row.category] || row.category,
                                    row.quantity,
                                    row.price,
                                    row.subtotal,
                                    getStatusText(row.order.status || 'pending')
                                ]);
                            });
                            addSheet('訂單明細', data, [12, 20, 12, 12, 12, 14, 24, 10, 28, 24, 10, 28, 10, 8, 10, 10, 10]);
                        }

                        // 統計類報表不含已取消的訂單
                        const statRows = rows.filter(row => row.order.status !== 'cancelled');
                        const groupBy = (keyOf, init) => {
                            const map = new Map();
                            statRows.forEach(row => {
                                const key = keyOf(row);
                                if (!map.has(key)) map.set(key, Object.assign({ quantity: 0, amount: 0, orders: new Set() }, init(row)));
                                const entry = map.get(key);
                                entry.quantity += row.quantity;
                                entry.amount += row.subtotal;
                                entry.orders.add(row.orderNumber);
                            });
                            return [...map.values()];
                        };

                        if (reportTypes.includes('customer')) {
                            const data = [['客戶姓名', '電話', 'Email', '訂單數', '購買件數', '消費金額（不含運費）']];
                            groupBy(row => row.customerKey, row => ({
                                name: row.order.customer?.name || '未知客戶',
                                phone: row.order.customer?.phone || '',
                                email: row.order.customer?.email || ''
                            }))
                                .sort((a, b) => b.amount - a.amount)
                                .forEach(entry => data.push([entry.name, entry.phone, entry.email, entry.orders.size, entry.quantity, entry.amount]));
                            addSheet('客戶統計', data, [14, 14, 26, 8, 10, 18]);
                        }

                        if (reportTypes.includes('product')) {
                            const data = [['商品名稱', '分類', '銷售數量', '銷售金額', '訂單數']];
                            groupBy(row => row.itemName, row => ({ name: row.itemName, category: row.category }))
                                .sort((a, b) => b.quantity - a.quantity)
                                .forEach(entry => data.push([entry.name, CATEGORY_LABELS[entry.category] || entry.category, entry.quantity, entry.amount, entry.orders.size]));
                            addSheet('商品銷售統計', data, [30, 10, 10, 12, 8]);
                        }

                        if (reportTypes.includes('category')) {
                            const data = [['分類', '銷售數量', '銷售金額', '訂單數']];
                            groupBy(row => row.category, row => ({ category: row.category }))
                                .sort((a, b) => b.amount - a.amount)
                                .forEach(entry => data.push([CATEGORY_LABELS[entry.category] || entry.category, entry.quantity, entry.amount, entry.orders.size]));
                            addSheet('分類統計', data, [12, 10, 12, 8]);
                        }

                        if (reportTypes.includes('daily')) {
                            const data = [['日期', '訂單數', '銷售件數', '銷售金額（不含運費）']];
                            groupBy(row => row.dateKey, row => ({ date: row.dateKey }))
                                .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0))
                                .forEach(entry => data.push([entry.date, entry.orders.size, entry.quantity, entry.amount]));
                            addSheet('每日銷售統計', data, [12, 8, 10, 18]);
                        }

                        const fileName = `Mes Fleurs 芳澤秀花藝設計_訂單報表_${localDateString()}.xlsx`;
                        XLSX.writeFile(workbook, fileName);

                        window.AdminCommon.showToast('Excel報表已成功生成並下載！', 'success');
                        excelExportModal.classList.remove('active');

                    } catch (error) {
                        console.error('生成Excel報表時出錯:', error);
                        window.AdminCommon.showToast('生成Excel報表時出錯，請稍後再試', 'error');
                    }
                }
                
                function getStatusText(status) {
                    const statusMap = {
                        'pending': '未付款',
                        'confirmed': '已付款',
                        'shipped': '可取花',
                        'completed': '已完成',
                        'cancelled': '已取消'
                    };
                    return statusMap[status] || '未知狀態';
                }
                
                // 加載訂單
                function loadOrders() {
                    orderList.innerHTML = '<p class="loading-message">載入訂單中...</p>';
                    orderDetail.innerHTML = '<div class="no-order-selected"><p>請選擇一個訂單查看詳情</p></div>';
                    
                    const ordersCollectionRef = window.firebaseServices.collection(window.firebaseServices.db, 'orders');
                    
                    try {
                        let q;
                        const statusValue = statusFilter.value;
                        
                        if (statusValue === 'all') {
                            q = window.firebaseServices.query(ordersCollectionRef, 
                                window.firebaseServices.orderBy('orderDate', 'desc'));
                        } else {
                            q = window.firebaseServices.query(ordersCollectionRef, 
                                window.firebaseServices.where('status', '==', statusValue));
                        }
                        
                        window.firebaseServices.getDocs(q)
                            .then((querySnapshot) => {
                                if (querySnapshot.empty) {
                                    orderList.innerHTML = '<p class="no-orders">沒有找到訂單</p>';
                                    return;
                                }
                                
                                const searchTerm = searchInput.value.trim().toLowerCase();
                                let filteredOrders = [];
                                
                                querySnapshot.forEach((doc) => {
                                    const orderData = doc.data();
                                    orderData.id = doc.id;
                                    
                                    if (searchTerm) {
                                        const orderNumber = orderData.orderNumber?.toLowerCase() || '';
                                        const customerName = orderData.customer?.name?.toLowerCase() || '';
                                        const customerPhone = orderData.customer?.phone?.toLowerCase() || '';
                                        const customerEmail = orderData.customer?.email?.toLowerCase() || '';
                                        
                                        if (orderNumber.includes(searchTerm) || 
                                            customerName.includes(searchTerm) || 
                                            customerPhone.includes(searchTerm) || 
                                            customerEmail.includes(searchTerm)) {
                                            filteredOrders.push(orderData);
                                        }
                                    } else {
                                        filteredOrders.push(orderData);
                                    }
                                });
                                
                                if (filteredOrders.length === 0) {
                                    orderList.innerHTML = '<p class="no-orders">沒有找到符合條件的訂單</p>';
                                    return;
                                }
                                
                                if (document.getElementById('sort-filter').value === 'pickupDate') {
                                    // 取花日期由近到遠；沒有取花日期的舊訂單排最後
                                    filteredOrders.sort((a, b) => {
                                        const da = a.pickupDate || '9999-99-99';
                                        const db = b.pickupDate || '9999-99-99';
                                        if (da !== db) return da < db ? -1 : 1;
                                        return (a.pickupTimeSlot || '') < (b.pickupTimeSlot || '') ? -1 : 1;
                                    });
                                } else if (statusValue !== 'all') {
                                    filteredOrders.sort((a, b) => {
                                        const dateA = a.orderDate && a.orderDate.toDate ? a.orderDate.toDate() : new Date(a.orderDate || 0);
                                        const dateB = b.orderDate && b.orderDate.toDate ? b.orderDate.toDate() : new Date(b.orderDate || 0);
                                        return dateB - dateA;
                                    });
                                }
                                
                                let ordersHTML = '';
                                
                                filteredOrders.forEach(order => {
                                    const orderDate = window.AdminCommon.formatDate(order.orderDate, 'full');
                                    
                                    let statusClass = '';
                                    let statusText = '';
                                    
                                    switch(order.status) {
                                        case 'pending':
                                            statusClass = 'pending';
                                            statusText = '未付款';
                                            break;
                                        case 'confirmed':
                                            statusClass = 'confirmed';
                                            statusText = '已付款';
                                            break;
                                        case 'shipped':
                                            statusClass = 'shipped';
                                            statusText = '可取花';
                                            break;
                                        case 'completed':
                                            statusClass = 'completed';
                                            statusText = '已完成';
                                            break;
                                        case 'cancelled':
                                            statusClass = 'cancelled';
                                            statusText = '已取消';
                                            break;
                                        default:
                                            statusClass = 'pending';
                                            statusText = '未付款';
                                    }
                                    
                                    ordersHTML += `
                                        <div class="order-item" data-id="${order.id}">
                                            <div class="order-item-header">
                                                <span class="order-number">${escapeHtml(order.orderNumber) || '無訂單編號'}</span>
                                                <span class="status-badge ${statusClass}">${statusText}</span>
                                                ${order.status === 'pending' && isPaymentReported(order) ? '<span class="status-badge reported">已回報匯款</span>' : ''}
                                            </div>
                                            <div class="order-item-body">
                                                <p><strong>客戶:</strong> ${escapeHtml(order.customer?.name) || '未知'}</p>
                                                <p><strong>金額:</strong> ${order.total || 0}</p>
                                                ${order.pickupDate ? `<p class="pickup-highlight"><strong>${order.shipping === 'delivery' ? '送達' : '取花'}:</strong> ${escapeHtml(order.pickupDate)} ${escapeHtml(order.pickupTimeSlot || '')}</p>` : ''}
                                                <p><strong>日期:</strong> ${orderDate}</p>
                                            </div>
                                        </div>
                                    `;
                                });
                                
                                orderList.innerHTML = ordersHTML;
                                
                                document.querySelectorAll('.order-item').forEach(item => {
                                    item.addEventListener('click', function() {
                                        document.querySelectorAll('.order-item').forEach(order => {
                                            order.classList.remove('selected');
                                        });
                                        
                                        this.classList.add('selected');
                                        
                                        const orderId = this.getAttribute('data-id');
                                        showOrderDetail(orderId);
                                    });
                                });

                                if (pendingOpenOrderId) {
                                    const targetId = pendingOpenOrderId;
                                    pendingOpenOrderId = null;
                                    const targetItem = Array.from(document.querySelectorAll('.order-item'))

                // ===== 取消/刪除訂單時把庫存加回 =====
                // 結帳時已經扣過庫存（payment.html 的 transaction），訂單取消或刪除時
                // 讓管理員選擇要不要加回去。訂單上記 stockRestored，避免同一筆訂單重複加回。
                // 只有「未付款／已付款」的訂單才會詢問；可取花、已完成代表商品已經寄出

                // 依訂單商品算出每個商品的庫存變化量（sign = 1 加回、-1 扣回），
                // 已經被刪除的商品略過（batch.update 對不存在的文件會讓整批失敗）
                async function buildStockChanges(items, sign) {
                    const services = window.firebaseServices;
                    const quantities = new Map();
                    (items || []).forEach(item => {
                        if (!item || !item.id) return;
                        quantities.set(item.id, (quantities.get(item.id) || 0) + (Number(item.quantity) || 0));
                    });
                    const ids = [...quantities.keys()];
                    const snaps = await Promise.all(ids.map(id => services.getDoc(services.doc(services.db, 'products', id))));
                    const changes = [];
                    const missing = [];
                    snaps.forEach((snap, index) => {
                        if (snap.exists()) {
                            changes.push({ ref: snap.ref, delta: sign * quantities.get(ids[index]) });
                        } else {
                            missing.push(ids[index]);
                        }
                    });
                    if (missing.length > 0) {
                        alert(`有 ${missing.length} 項商品已經被刪除，這些商品的庫存不會調整。`);
                    }
                    return changes;
                }

                // 訂單本身的更新/刪除跟庫存調整放在同一個 batch，一起成功或一起失敗
                function commitOrderWithStock(orderDocRef, orderOp, stockChanges) {
                    const services = window.firebaseServices;
                    const batch = services.writeBatch(services.db);
                    if (orderOp.type === 'delete') {
                        batch.delete(orderDocRef);
                    } else {
                        batch.update(orderDocRef, orderOp.data);
                    }
                    stockChanges.forEach(change => {
                        batch.update(change.ref, {
                            stock: services.increment(change.delta),
                            lastUpdated: services.serverTimestamp()
                        });
                    });
                    return batch.commit();
                }

                const STOCK_RESTORABLE_STATUSES = ['pending', 'confirmed'];

                // 更新訂單狀態
                async function updateOrderStatus(orderId, newStatus) {
                    const orderDocRef = window.firebaseServices.doc(window.firebaseServices.db, 'orders', orderId);

                    // 已付款/可取花/已完成邏輯上都代表錢已經收到了，管理員手動改狀態時
                    // 一併同步 paymentConfirmed，避免跟顧客自己回報匯款那條路徑的資料兜不起來
                    const updateData = { status: newStatus };
                    if (['confirmed', 'shipped', 'completed'].includes(newStatus)) {
                        updateData.paymentConfirmed = true;
                    }

                    let stockChanges = [];
                    try {
                        const snap = await window.firebaseServices.getDoc(orderDocRef);
                        const order = snap.exists() ? snap.data() : null;
                        const oldStatus = order ? (order.status || 'pending') : null;
                        if (order && newStatus === 'cancelled' && !order.stockRestored &&
                            STOCK_RESTORABLE_STATUSES.includes(oldStatus)) {
                            if (confirm('訂單即將改成「已取消」。\n要把這筆訂單的商品數量加回庫存嗎？\n\n（確定＝加回庫存，取消＝只改狀態）')) {
                                stockChanges = await buildStockChanges(order.items, 1);
                                updateData.stockRestored = true;
                            }
                        } else if (order && oldStatus === 'cancelled' && newStatus !== 'cancelled' && order.stockRestored) {
                            if (confirm('這筆訂單取消時已經把庫存加回去了。\n恢復訂單要再把商品數量從庫存扣掉嗎？\n\n（確定＝扣回庫存，取消＝只改狀態）')) {
                                stockChanges = await buildStockChanges(order.items, -1);
                                updateData.stockRestored = false;
                            }
                        }
                    } catch (error) {
                        console.error('讀取訂單資料失敗:', error);
                        window.AdminCommon.showToast('讀取訂單資料失敗，請稍後再試', 'error');
                        return;
                    }

                    commitOrderWithStock(orderDocRef, { type: 'update', data: updateData }, stockChanges)
                        .then(() => {
                            const orderItem = document.querySelector(`.order-item[data-id="${orderId}"]`);
                            if (orderItem) {
                                const statusElement = orderItem.querySelector('.status-badge');
                                if (statusElement) {
                                    statusElement.classList.remove(
                                        'pending', 'confirmed', 'shipped', 'completed', 'cancelled'
                                    );
                                    
                                    statusElement.classList.add(newStatus);
                                    
                                    let statusText = '';
                                    switch(newStatus) {
                                        case 'pending': statusText = '未付款'; break;
                                        case 'confirmed': statusText = '已付款'; break;
                                        case 'shipped': statusText = '可取花'; break;
                                        case 'completed': statusText = '已完成'; break;
                                        case 'cancelled': statusText = '已取消'; break;
                                        default: statusText = '未付款';
                                    }
                                    statusElement.textContent = statusText;
                                }
                                const reportedBadge = orderItem.querySelector('.status-badge.reported');
                                if (reportedBadge && newStatus !== 'pending') reportedBadge.remove();
                            }
                            
                            window.AdminCommon.showToast(
                                stockChanges.length > 0 ? '訂單狀態已更新，庫存已同步調整' : '訂單狀態已更新',
                                'success'
                            );
                            // 重新顯示詳情，讓「已回報匯款」提示等資訊跟著更新
                            showOrderDetail(orderId);
                        })
                        .catch((error) => {
                            console.error('更新訂單狀態時出錯:', error);
                            window.AdminCommon.showToast('更新訂單狀態時出錯，請稍後再試', 'error');
                        });
                }
                
                // 刪除訂單功能
                async function deleteOrder(orderId) {
                    const orderDocRef = window.firebaseServices.doc(window.firebaseServices.db, 'orders', orderId);

                    let stockChanges = [];
                    try {
                        const snap = await window.firebaseServices.getDoc(orderDocRef);
                        const order = snap.exists() ? snap.data() : null;
                        if (order && !order.stockRestored && STOCK_RESTORABLE_STATUSES.includes(order.status || 'pending')) {
                            if (confirm('這筆訂單的花禮還沒完成，要把可預訂數量加回去嗎？\n\n（確定＝加回庫存，取消＝不調整庫存）')) {
                                stockChanges = await buildStockChanges(order.items, 1);
                            }
                        }
                    } catch (error) {
                        console.error('讀取訂單資料失敗:', error);
                        window.AdminCommon.showToast('讀取訂單資料失敗，請稍後再試', 'error');
                        return;
                    }

                    commitOrderWithStock(orderDocRef, { type: 'delete' }, stockChanges)
                        .then(() => {
                            const orderItem = document.querySelector(`.order-item[data-id="${orderId}"]`);
                            if (orderItem) {
                                orderItem.remove();
                            }
                            
                            orderDetail.innerHTML = '<div class="no-order-selected"><p>請選擇一個訂單查看詳情</p></div>';
                            
                            const orderItems = document.querySelectorAll('.order-item');
                            if (orderItems.length === 0) {
                                orderList.innerHTML = '<p class="no-orders">沒有找到訂單</p>';
                            }
                            
                            window.AdminCommon.showToast('訂單已成功刪除', 'success');
                        })
                        .catch((error) => {
                            console.error('刪除訂單時出錯:', error);
                            window.AdminCommon.showToast('刪除訂單時出錯，請稍後再試', 'error');
                        });
                }
                
                // 管理員更新訂單備註

                                return window.firebaseServices.updateDoc(orderDocRef, {

                                    <div class="form-group">
                                        <label for="edit-pickup-time">時段</label>
                                        <input type="text" id="edit-pickup-time" value="${escapeHtml(orderData.pickupTimeSlot || '')}" placeholder="例：14:00-16:00">
                                    </div>
                                </div>

                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="edit-shipping-fee">外送費</label>
                                        <input type="number" id="edit-shipping-fee" value="${orderData.shippingFee || 0}" min="0" step="1">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="edit-card-message">卡片內容</label>
                                    <textarea id="edit-card-message" rows="3">${escapeHtml(orderData.cardMessage || '')}</textarea>
                                </div>

                                <div class="form-group">
                                    <label for="edit-order-notes">客戶備註</label>
                                    <!-- 用 textarea：備註裡有多筆匯款紀錄、管理員備註，單行輸入框會把換行全部吃掉 -->
                                    <textarea id="edit-order-notes" rows="6">${escapeHtml(orderData.notes)}</textarea>
                                </div>
                                
                                <div class="edit-form-actions">
                                    <button type="button" id="cancel-edit-btn" class="btn btn-secondary">取消</button>
                                    <button type="submit" class="btn btn-success">
                                        <i class="fas fa-save"></i> 儲存變更
                                    </button>
                                </div>
                            </form>
                        </div>
                    `;
                    
                    customerSection.innerHTML = editFormHTML;
                    
                    // 綁定配送方式變更事件
                    const shippingMethodSelect = document.getElementById('edit-shipping-method');
                    const addressLabel = document.getElementById('address-label');
                    
                    shippingMethodSelect.addEventListener('change', function() {
                        addressLabel.textContent = this.value === 'delivery' ? '外送地址' : '外送地址（門市自取免填）';
                    });
                    
                    // 綁定表單提交事件
                    const editForm = document.getElementById('edit-customer-form');
                    editForm.addEventListener('submit', function(e) {
                        e.preventDefault();
                        saveOrderChanges(orderId);
                    });
                    
                    // 綁定取消按鈕
                    const cancelBtn = document.getElementById('cancel-edit-btn');
                    cancelBtn.addEventListener('click', function() {
                        showOrderDetail(orderId);
                    });
                }

                // 儲存訂單變更
                async function saveOrderChanges(orderId) {
                    try {
                        const submitBtn = document.querySelector('#edit-customer-form button[type="submit"]');
                        const originalText = submitBtn.innerHTML;
                        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 儲存中...';
                        submitBtn.disabled = true;
                        
                        // 獲取表單數據
                        const customerName = document.getElementById('edit-customer-name').value.trim();
                        const customerPhone = document.getElementById('edit-customer-phone').value.trim();
                        const customerEmail = document.getElementById('edit-customer-email').value.trim();
                        const customerAddress = document.getElementById('edit-customer-address').value.trim();
                        const shippingMethod = document.getElementById('edit-shipping-method').value;
                        const paymentMethod = document.getElementById('edit-payment-method').value;
                        const shippingFee = parseInt(document.getElementById('edit-shipping-fee').value) || 0;
                        const orderNotes = document.getElementById('edit-order-notes').value.trim();
                        const pickupDate = document.getElementById('edit-pickup-date').value;
                        const pickupTimeSlot = document.getElementById('edit-pickup-time').value.trim();
                        const cardMessage = document.getElementById('edit-card-message').value.trim();
                        
                        // 驗證必填欄位
                        if (!customerName) {
                            window.AdminCommon.showToast('客戶姓名為必填欄位', 'error');
                            return;
                        }
                        
                        // 獲取當前訂單數據以計算新的總金額
                        const orderDocRef = window.firebaseServices.doc(window.firebaseServices.db, 'orders', orderId);
                        const docSnap = await window.firebaseServices.getDoc(orderDocRef);
                        
                        if (!docSnap.exists()) {
                            window.AdminCommon.showToast('訂單不存在', 'error');
                            return;
                        }
                        
                        const currentOrderData = docSnap.data();
                        const subtotal = currentOrderData.subtotal || 0;
                        const newTotal = subtotal + shippingFee;
                        
                        // 更新訂單數據
                        const updateData = {
                            customer: {
                                name: customerName,
                                phone: customerPhone,
                                email: customerEmail,
                                address: customerAddress
                            },
                            shipping: shippingMethod,
                            payment: paymentMethod,
                            shippingFee: shippingFee,
                            total: newTotal,
                            notes: orderNotes,
                            pickupDate: pickupDate,
                            pickupTimeSlot: pickupTimeSlot,
                            cardMessage: cardMessage,
                            fulfillment: Object.assign({}, currentOrderData.fulfillment || {}, {
                                method: shippingMethod,
                                date: pickupDate,
                                timeSlot: pickupTimeSlot
                            }),
                            lastModified: new Date(),
                            modifiedBy: 'admin'
                        };
                        
                        await window.firebaseServices.updateDoc(orderDocRef, updateData);
                        
                        window.AdminCommon.showToast('訂單信息已成功更新', 'success');
                        
                        // 重新載入訂單詳情
                        showOrderDetail(orderId);
                        
                        // 重新載入訂單列表以反映變更
                        loadOrders();
                        
                    } catch (error) {
                        console.error('更新訂單信息時出錯:', error);
                        window.AdminCommon.showToast('更新訂單信息時出錯：' + error.message, 'error');
                    } finally {
                        const submitBtn = document.querySelector('#edit-customer-form button[type="submit"]');
                        if (submitBtn) {
                            submitBtn.innerHTML = '<i class="fas fa-save"></i> 儲存變更';
                            submitBtn.disabled = false;
                        }
                    }
                }
            }
            
            // 開始初始化流程
            waitForAdminCommon();
        });
    </script>
</body>
</html>
