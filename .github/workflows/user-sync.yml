name: 會員資料同步

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch: {}

jobs:
  run-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/reconcile-user-profiles
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: 執行會員資料同步
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "尚未設定 FIREBASE_SERVICE_ACCOUNT，略過"; exit 0; fi
          node run.mjs --apply
